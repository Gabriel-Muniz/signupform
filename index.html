<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up form</title>
    <link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/pathway-extreme" type="text/css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="left-section">
            <div class="logo-section">XÔD</div>

            <span class="photo-credits">
                Photo by <a
                    href="https://unsplash.com/@ivvndiaz?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Iván
                    Díaz</a> on <a
                    href="https://unsplash.com/photos/koi-fish-swimming-in-dark-water-8e8t4hCUKpM?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
            </span>
        </div>
        <div class="right-section">
            <div class="about-form">
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams.
                </p>
                <p>
                    Sign up <span class="italic">now</span> to get started.
                </p>

                <p class="slogan-phrase">You <em>know</em> you want to.</p>
            </div>
            <div class="form-container">
                <form id="sign-up-form">
                    <h1>Let's do this!</h1>

                    <div class="form-row">
                        <label for="first-name">FIRST NAME<span></span></label>
                        <input type="text" name="first-name" id="first-name" placeholder="Arthur" pattern="[^-\s]" required/>
                        <span></span>
                    </div>

                    <div class="form-row">
                        <label for="last-name">LAST NAME<span></span></label>
                        <input type="text" name="last-name" id="last-name" placeholder="Morgan" required/>
                        <span></span>
                    </div>

                    <div class="form-row">
                        <label for="email">EMAIL<span></span></label>
                        <input type="email" name="email" id="email" placeholder="john@example.com" required/>
                        <span></span>
                    </div>

                    <div class="form-row">
                        <label for="phone_number">PHONE NUMBER<span></span></label>
                        <input type="text" inputmode="numeric" placeholder="(XX) 9XXXX-XXXX" />
                        <span></span>
                    </div>

                    <div class="form-row">
                        <label for="pwd">PASSWORD<span></span></label>
                        <input type="password" name="pwd" id="pwd" placeholder="Password" pattern=".{8,12}" required />
                        <span></span>
                    </div>

                    <div class="form-row">
                        <label for="confirm-pwd">CONFIRM PASSWORD<span></span></label>
                        <input type="password" name="confirm-pwd" placeholder="Confirm password" pattern=".{8,12}" id="confirm-pwd" required />
                        <span></span>
                    </div>
                </form>
            </div>
            <div class="action-section">
                <button class="btn-submit" type="submit" form="sign-up-form">
                    Create Account
                </button>

                <p class="log-in-callout">
                    Already have an account? <a class="log-in" href="#">Log in</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
