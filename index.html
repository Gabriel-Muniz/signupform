<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="left-section">
            <div class="logo-section">XÔD</div>

            <span class="photo-credits">
                Photo by <a
                    href="https://unsplash.com/@ivvndiaz?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Iván
                    Díaz</a> on <a
                    href="https://unsplash.com/photos/koi-fish-swimming-in-dark-water-8e8t4hCUKpM?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
            </span>
        </div>
        <div class="right-section">
            <div class="about-form">
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams.
                </p>
                <p> Sign up now to get started.
                </p>
            </div>
            <div class="form-container">
                <form id="sign-up-form">
                    <h1>Let's do this!</h1>

                    <div class="form-row">
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" name="first-name" id="first-name" />

                        <label for="last-name">LAST NAME</label>
                        <input type="text" name="last-name" id="last-name" />
                    </div>
                    <div class="form-row">
                        <label for="email">EMAIL</label>
                        <input type="email" name="email" id="email" />

                        <label for="phone_number">PHONE NUMBER</label>
                        <input type="text" inputmode="numeric" />
                    </div>
                    <div class="form-row">
                        <label for="pwd">PASSWORD</label>
                        <input type="password" name="pwd" id="pwd" />

                        <label for="confirm-pwd">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm-pwd" id="confirm-pwd" />
                    </div>
                </form>
            </div>
            <div class="action-section">
                <button type="submit" form="sign-up-form">
                    Create Account
                </button>

                <p>
                    Already have an account? <a href="#">Log in</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
