                        <label for="phone_number">PHONE NUMBER</label>
                        <input type="text" inputmode="numeric" placeholder="(XX) 9XXXX-XXXX">
                        <span></span>
                    </div>

                    <div class="form-row">
                        <label for="pwd">PASSWORD</label>
                        <input type="password" name="pwd" id="pwd" minlength="8" maxlength="32" required="">
                        <span></span>
                    </div>

                    <div class="form-row">
                        <label for="confirm-pwd">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm-pwd" id="confirm-pwd" minlength="8" maxlength="32" required="">

                    </div>

            <div class="action-section">
                <button class="btn-submit" type="submit" form="sign-up-form">
